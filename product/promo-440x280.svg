<svg width="440" height="280" viewBox="0 0 440 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：深色渐变 -->
  <rect width="440" height="280" fill="url(#bg_gradient)"/>
  
  <!-- 噪点纹理层 -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="440" height="280" filter="url(#noise)" opacity="0.05"/>

  <!-- 装饰性光晕 -->
  <circle cx="400" cy="50" r="100" fill="#3b82f6" opacity="0.15" filter="url(#blur)"/>
  <circle cx="40" cy="240" r="80" fill="#f97316" opacity="0.1" filter="url(#blur)"/>

  <!-- 核心玻璃卡片 -->
  <rect x="40" y="60" width="360" height="160" rx="24" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
  <rect x="40" y="60" width="360" height="160" rx="24" style="backdrop-filter: blur(10px);"/>

  <!-- 文字部分 -->
  <text x="70" y="115" fill="white" font-family="SF Pro Display, Inter, sans-serif" font-size="32" font-weight="bold" letter-spacing="-0.02em">
    千面书签
  </text>
  <text x="70" y="145" fill="white" fill-opacity="0.6" font-family="SF Pro Display, Inter, sans-serif" font-size="14" font-weight="medium" letter-spacing="0.1em">
    INTELLIGENT WORKSPACE
  </text>
  
  <!-- 功能标签 -->
  <g transform="translate(70, 170)">
    <rect width="70" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="35" y="16" fill="#60a5fa" font-size="10" text-anchor="middle" font-family="sans-serif">树形管理</text>
    
    <rect x="80" width="70" height="24" rx="12" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
    <text x="115" y="16" fill="white" fill-opacity="0.8" font-size="10" text-anchor="middle" font-family="sans-serif">极客模式</text>
    
    <rect x="160" width="80" height="24" rx="12" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
    <text x="200" y="16" fill="white" fill-opacity="0.8" font-size="10" text-anchor="middle" font-family="sans-serif">企业联动</text>
  </g>

  <!-- 右侧装饰图标 (模拟侧边栏) -->
  <rect x="340" y="85" width="32" height="32" rx="8" fill="white" fill-opacity="0.1"/>
  <path d="M350 101L362 101" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M350 97L362 97" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M350 105L362 105" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- 渐变与滤镜定义 -->
  <defs>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="blur" x="-100" y="-100" width="400" height="400" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
</svg>
